name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compiler_version:
        description: Published @lmctl-ai/lmctl version (blank uses the pin file or repository variable)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LMCODE_COMPILER_VERSION: ${{ vars.LMCODE_COMPILER_VERSION }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: linux-x64}
          - {os: ubuntu-24.04-arm, label: linux-arm64}
          - {os: macos-15, label: macos-arm64}
          - {os: macos-15-intel, label: macos-x64}
          - {os: windows-2022, label: windows-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install compiler from npm
        env:
          INPUT_COMPILER_VERSION: ${{ inputs.compiler_version }}
        run: |
          version="${INPUT_COMPILER_VERSION:-${LMCODE_COMPILER_VERSION:-$(tr -d '[:space:]' < scripts/ci/compiler-version)}}"
          test -n "$version"
          npm install --prefix "$RUNNER_TEMP/lmctl" "@lmctl-ai/lmctl@$version"
          echo "$RUNNER_TEMP/lmctl/node_modules/.bin" >> "$GITHUB_PATH"
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "LMSCRIPT_BIN=$RUNNER_TEMP/lmctl/node_modules/.bin/lmscript.cmd" >> "$GITHUB_ENV"
          else
            echo "LMSCRIPT_BIN=$RUNNER_TEMP/lmctl/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
          fi
          echo "Using @lmctl-ai/lmctl@$version"
      - name: Run the complete sample suite
        run: ./test.sh

